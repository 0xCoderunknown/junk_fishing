name: junk_fishing
description: "An Android-only casual/gacha junk fishing game built with Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  screenshot: ^3.0.0
  share_plus: ^13.3.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/locations/
    - assets/images/items/
    - assets/images/character/
